spring.application.name=evcomp


# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Output Formatting
spring.jackson.serialization.indent_output=true
spring.profiles.active=mysql

# Integrações Externas (Lido via variável de ambiente)
resend.api.key=${RESEND_API_KEY:}
resend.email.from=${RESEND_EMAIL_FROM:EvComp <no-reply@secompp.com.br>}
app.frontend.url=${FRONTEND_URL:https://secompp.com.br}

# Comprovantes de pagamento
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Onde gravar os comprovantes: BANCO (padrão), DISCO ou S3 (ainda não implementado).
pagamento.armazenamento=${PAGAMENTO_ARMAZENAMENTO:BANCO}
# Usado apenas quando pagamento.armazenamento=DISCO.
pagamento.diretorio-uploads=${PAGAMENTO_DIRETORIO_UPLOADS:uploads/comprovantes}

