<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Relatório de Participantes Confirmados</title>
    <style>
        body { font-family: 'Helvetica', 'Arial', sans-serif; color: #333; margin: 40px; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #0056b3; padding-bottom: 12px; }
        .header h1 { color: #0056b3; margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 4px 0 0; color: #555; font-size: 13px; }
        .summary-box { background-color: #f1f5f9; border-left: 4px solid #0056b3; padding: 10px 15px; margin-bottom: 20px; font-size: 13px; color: #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; font-size: 12px; }
        th { background-color: #0056b3; color: #ffffff; font-weight: bold; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .badge-modalidade { font-weight: bold; color: #0f172a; }
        .footer { position: fixed; bottom: 20px; width: 100%; text-align: center; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Relatório de Participantes Confirmados</h1>
        <p>Evento: <strong>$nomeEvento</strong></p>
        <p>Gerado em: $dataGeracao</p>
    </div>

    <div class="summary-box">
        Total de Participantes Confirmados (Pagamento Aprovado / Isento): <strong>$totalParticipantes</strong>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 35%;">Nome do Participante</th>
                <th style="width: 40%;">E-mail</th>
                <th style="width: 25%;">Modalidade de Inscrição</th>
            </tr>
        </thead>
        <tbody>
            $linhasTabela
        </tbody>
    </table>

    <div class="footer">
        Sistema EvComp — Documento Oficial de Conferência
    </div>
</body>
</html>
